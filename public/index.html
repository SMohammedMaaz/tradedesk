.glass h2{margin:12px 0 2px;text-align:center;font-size:24px}.glass .sub{text-align:center;opacity:.85;font-size:13px;margin-bottom:16px}.glass .tile{margin:0 auto}

.glass label{color:#ffffffcc}.glass input{background:#ffffffeb;color:#161b33;border:0}.glass input::placeholder{color:#7a86b0}.glass .btn.p:hover{background:#f3f4ff}.glass .err{color:#ffd3d6}

@media(max-width:860px){#login{grid-template-columns:1fr;align-content:start}.lh{padding:34px 22px 6px;align-self:auto}.lh h1{font-size:30px}.lc{padding:14px 14px 30px}}

.nav:hover{background:#ffffff1a}.nav.on{background:#ffffff30;color:#fff;box-shadow:inset 0 0 0 1px #ffffff2e}.nav.on:after{content:"";margin-left:auto;width:7px;height:7px;border-radius:50%;background:#fff}
